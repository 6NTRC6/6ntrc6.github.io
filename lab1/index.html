<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космічний Симулятор - Головна</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <h1 class="site-title"><a href="index.html">Космічний Симулятор</a></h1>
            <nav class="site-nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Головна</a></li>
                    <li><a href="missions.html" class="nav-link">Експедиції</a></li>
                    <li><a href="journeys.html" class="nav-link">Мої подорожі</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section id="spacecraft" class="section-корабель">
                <h2 class="section-title">Космічний корабель</h2>
                <article class="spacecraft-info">
                    <img src="https://i1.sndcdn.com/artworks-j8xjG7zc1wmTeO7b-O6l83w-t500x500.jpg" alt="Зображення космічного корабля" class="spacecraft-image responsive-image">
                    <div class="ship-details">
                        <h3 class="article-title">Стан корабля</h3>
                        <div class="ship-status">
                            <!-- Fuel -->
                            <div class="status-item">
                                <i class="fas fa-gas-pump status-icon"></i>
                                <span class="status-label">Паливо:</span>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: 89%;" id="fuel-bar"></div>
                                     <span class="status-value">89%</span>
                                </div>
                            </div>

                            <!-- Energy -->
                            <div class="status-item">
                                <i class="fas fa-bolt status-icon"></i>
                                <span class="status-label">Енергія:</span>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: 100%;" id="energy-bar"></div>
                                    <span class="status-value">100%</span>
                                </div>
                            </div>

                            <!-- Oxygen Level -->
                            <div class="status-item">
                                <i class="fas fa-lungs status-icon"></i>
                                <span class="status-label">Кисень:</span>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: 99%;" id="oxygen-bar"></div>
                                     <span class="status-value">99%</span>
                                </div>
                            </div>

                            <div class="status-item">
                                <i class="fas fa-people-group status-icon"></i>
                                <span class="status-label">Екіпаж:</span>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: 45%;" id="crew-bar"></div>
                                     <span class="status-value">9 / 20</span>
                                </div>
                            </div>

                                

                        </div>
                    </div>
                </article>
            </section>
        </div>
    </main>

    <footer class="site-footer">
          <!-- Content from original index.html -->
        <div class="container footer-container">
            <p class="footer-copyright">© 2025 Космічний Симулятор. Всі права захищені.</p>
            <ul class="footer-links">
                <li class="footer-item"><a href="mailto:spacesimulator@example.com" class="footer-link">spacesimulator@example.com</a></li>
                
            </ul>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>

</body>
</html>
